<html>

<head>

  <title>イラストランダム表示</title>
  <meta content="描いたイラストをボタンをおすごとにランダムに表示する" genre="illust">
</head>
<link rel="stylesheet" href="js/style.css">

<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--c1);
    color: #DDD;

    padding: 1em;
    font-size: 2em;
  }

  .button {
    color: #DDD;
    font-size: 1em;
    background-color: var(--c3);
    border: 0px;
  }

  #cont {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    background-color: #000;
  }

  #imgTitle {
    font-size: 2em;
  }

  #numInput {
    font-size: 2em;
    width: 3em;
    background-color: #000;
    color: var(--c2);
    text-align: center;
    border-width: 0;
  }

  #imgMeta {
    font-size: 0.7em;
  }
</style>

<body>
  <div id="cont">
    <!-- <div id="imgTitle"></div> -->
    <input type="number" id="numInput" name="input_name" value="" />
    <div id="imgMeta"></div>

  </div>
  <div id="imgDiv"></div>

  <input type="button" class="button" style="width:15em;height:3em;" value="ランダム" onclick="button()" />

<script>
  let imgDiv = document.getElementById("imgDiv")
  let imgMeta = document.getElementById("imgMeta")
  let numInput = document.getElementById("numInput")
  let illustrations = []
  let height = window.innerHeight

  numInput.addEventListener("input", () => {
    const q = numInput.value
    if (q !== "") {
      window.history.replaceState(null, null, '?n=' + q)
      renderIllustration(q)
    }
  })

  function button() {
    if (illustrations.length === 0) return
    const p = illustrations[Math.floor(Math.random() * illustrations.length)]
    window.history.replaceState(null, null, '?n=' + p.num)
    renderIllustration(p.num)
  }

  const parseCSV = (csv) => {
    let tmp = []
    csv = csv.replace(/("[^"]*")+/g, (match) => {
      tmp.push(match.slice(1, -1).replace(/""/g, '"'))
      return '[TMP]'
    })
    return csv.split("\n").map((row) => {
      return row.split(',').map((val) => val === '[TMP]' ? tmp.shift() : val)
    })
  }

  function main() {
    return fetch("json/illust.csv")
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        return response.arrayBuffer()
      })
      .then(binary => {
        const text = new TextDecoder('shift-jis').decode(binary)
        const lines = parseCSV(text)
        const headers = lines[0]
        illustrations = []

        for (let i = 1; i < lines.length; i++) {
          const values = lines[i]
          if (values.length === headers.length) {
            const dictionary = {}
            for (let j = 0; j < headers.length; j++) {
              dictionary[headers[j]] = values[j]
            }
            if (dictionary.num !== "") illustrations.push(dictionary)
          }
        }

        if (illustrations.length === 0) {
          imgMeta.textContent = "作品データがありません"
          return
        }

        const url = new URL(window.location.href)
        const requested = url.searchParams.get("n")
        const requestedIllustration = illustrations.find(p => p.num == requested)
        const selected = requestedIllustration || illustrations[Math.floor(Math.random() * illustrations.length)]

        if (!requestedIllustration) {
          url.searchParams.set('n', selected.num)
          window.history.replaceState(null, null, url)
        }
        renderIllustration(selected.num)
      })
      .catch(error => {
        console.error('CSVの読み込みエラー:', error)
        imgMeta.textContent = "作品データを読み込めませんでした"
      })
  }

  function renderIllustration(n) {
    const p = illustrations.find(p => p.num == n)
    if (!p) {
      imgDiv.innerHTML = ""
      imgMeta.textContent = `作品番号 ${n} は見つかりません`
      return
    }

    numInput.value = p.num
    document.title = p.num + ".png"
    const imgPath = "illusts/" + p.num + ".png"
    imgDiv.innerHTML = `<img src="${imgPath}" height="${height * 0.7}" alt="${p.title || p.num}">`

    let meta = "link: " + `<a href="${imgPath}">${imgPath}</a>`
      + "<br>" + "w×h: " + p.width + "×" + p.height
      + "<br>"

    if (p.title) { meta += "title: " + p.title + "<br>" }
    if (p.date) { meta += "date: " + p.date + "<br>" }
    if (p.twitter) { meta += "twitter: " + `<a href="${p.twitter}">twitter</a>` + "<br>" }
    if (p.tags && p.tags.length > 0) {
      meta += "tags: "
      for (let k = 0; k < p.tags.split(",").length; k++) {
        meta += "#" + p.tags.split(",")[k] + " "
      }
      meta += "<br>"
    }
    if (p.description) { meta += "description: " + p.description + "<br>" }
    imgMeta.innerHTML = meta
  }

  main()
</script>
</body>

</html>
